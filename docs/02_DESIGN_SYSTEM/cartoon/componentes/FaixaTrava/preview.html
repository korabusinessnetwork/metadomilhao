<!-- @dsCard group="Trade" height=230 subtitle="Diário fechado, com motivo e reabertura" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>FaixaTrava</title></head>
<body>
<div style="padding:4px 6px 6px 2px">
  <section class="rm-trava rm-trava--balanca" id="trava" role="status" aria-labelledby="tt">
    <div class="rm-trava__listras" aria-hidden="true"></div>
    <div class="rm-trava__corpo">
      <svg class="rm-trava__cadeado" viewBox="0 0 44 44" aria-hidden="true">
        <path class="alca" d="M14 20 V14 a8 8 0 0 1 16 0 V20"/>
        <rect class="corpo" x="7" y="19" width="30" height="21" rx="6"/>
        <circle class="furo" cx="22" cy="28.5" r="3.5"/>
      </svg>
      <div>
        <h2 class="rm-trava__titulo" id="tt">Diário fechado</h2>
        <p class="rm-trava__texto">Limite de perda diária atingido: <span class="rm-num">−R$ 300,00</span>. Novas operações estão bloqueadas.</p>
        <span class="rm-trava__reabre">Reabre em <span class="rm-num">26/11/2026</span> às <span class="rm-num">09:00</span></span>
      </div>
    </div>
  </section>
  <div class="rm-demo" aria-label="Controle da prévia">
    <span>Prévia:</span>
    <button type="button" id="repetir">Ver o fechamento de novo</button>
  </div>
</div>
<script>
document.getElementById('repetir').addEventListener('click', function () {
  var t = document.getElementById('trava');
  t.classList.remove('rm-trava--balanca'); void t.offsetWidth; t.classList.add('rm-trava--balanca');
});
</script>
</body>
</html>
